name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish tessera-ir
        run: cargo publish -p tessera-ir --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tessera-backend-ptx
        run: cargo publish -p tessera-backend-ptx --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tessera-backend-spirv
        run: cargo publish -p tessera-backend-spirv --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tessera-backend-metal
        run: cargo publish -p tessera-backend-metal --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tessera-runtime
        run: cargo publish -p tessera-runtime --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tessera
        run: cargo publish -p tessera --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
